<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>소환음 청취실</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#171d19;color:#f2eee1}*{box-sizing:border-box}body{margin:0;padding:24px 16px 36px}main{max-width:620px;margin:auto}h1{font-size:24px;margin:0 0 10px}h2{font-size:19px;margin:0 0 8px}p{line-height:1.65;color:#c7cfbf;margin:0 0 16px}section{margin:16px 0;padding:18px 14px;background:#252e27;border:1px solid #465747;border-radius:12px}audio{display:block;width:100%;height:54px;margin:12px 0;min-width:0}a{color:#ecdbac;display:inline-block;min-height:44px;padding:12px 0;text-underline-offset:4px}button{border:0;border-radius:8px;min-height:48px;width:100%;background:#d7c28e;color:#191e19;font:600 16px system-ui;padding:12px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a4d4bb;outline-offset:3px}small{color:#c7cfbf}footer{font-size:14px;line-height:1.6}#status{margin-top:12px;min-height:24px}
</style></head>
<body><main><h1>소환음 청취실</h1><p>게임풍 믹스 후보입니다. 낮은 음량부터 들어보세요.</p>
<section><h2>세 소리 한 번에 · 4.20초</h2><p>늑대 → 독수리 → 곰</p><button type="button" data-audio="all">▶ 세 소리 듣기</button><audio id="all" controls playsinline preload="metadata" aria-label="세 소리 한 번에 듣기"><source src="listen-all-v2.wav" type="audio/wav"></audio><a href="listen-all-v2.wav">음원만 바로 열기</a></section>
<section><h2>늑대 · 0.85초</h2><audio id="wolf" controls playsinline preload="metadata" aria-label="늑대 믹스"><source src="wolf-game.wav" type="audio/wav"></audio></section>
<section><h2>독수리 · 0.65초</h2><audio id="eagle" controls playsinline preload="metadata" aria-label="독수리 믹스"><source src="eagle-game.wav" type="audio/wav"></audio></section>
<section><h2>곰 · 1.10초 · 수정본</h2><audio id="bear" controls playsinline preload="metadata" aria-label="곰 믹스"><source src="bear-game-v2.wav" type="audio/wav"></audio></section>
<p id="status" role="status" aria-live="polite"></p><footer>청취용 후보 · 게임 적용 전<br><a href="credits.html">음원 출처</a></footer></main>
<script>
const tracks=[...document.querySelectorAll('audio')];const status=document.getElementById('status');
tracks.forEach(a=>{a.volume=.65;a.addEventListener('play',()=>{tracks.forEach(b=>{if(b!==a)b.pause();});status.textContent=a.getAttribute('aria-label')+' 재생 중';});a.addEventListener('ended',()=>{status.textContent='재생 완료';});a.addEventListener('error',()=>{status.textContent='재생이 어려우면 음원만 바로 열기를 눌러 주세요.';});});
document.querySelector('[data-audio]').addEventListener('click',async e=>{const a=document.getElementById(e.currentTarget.dataset.audio);a.currentTime=0;try{await a.play();}catch{status.textContent='아래 기본 재생 버튼 또는 음원만 바로 열기를 눌러 주세요.';}});
</script></body></html>
